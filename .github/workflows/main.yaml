name: Application Deployment To EKS

on:
  push:
    branches:
      - cloud-challenge
      - main

jobs:
  docker_build:
    name: Build, Test & Push to DockerHub
    environment: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker build for testing
        run: |
          docker build . --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/cloud-challenge:latest
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/cloud-challenge:latest ${{ secrets.DOCKERHUB_USERNAME }}/cloud-challenge:${{ github.run_number }}

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-challenge:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-challenge:${{ github.run_number }}

  trivy_scan:
    name: Scan Docker Image for Vulnerabilities
    needs: [docker_build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.43.0/trivy_0.43.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.43.0_Linux-64bit.deb
          trivy --version  # Verify Trivy installation

      - name: Scan Docker image with Trivy
        run: |
          echo "Scanning Docker image for vulnerabilities..."
          trivy image --severity HIGH,CRITICAL --format table ${{ secrets.DOCKERHUB_USERNAME }}/cloud-challenge:latest
          trivy image --severity HIGH,CRITICAL --format table ${{ secrets.DOCKERHUB_USERNAME }}/cloud-challenge:${{ github.run_number }}
