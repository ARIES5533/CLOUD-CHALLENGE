name: Application Deployment To EKS

on:
  push:
    branches:
      - cloud-challenge
      - main

jobs:
  docker_build:
    name: Build & Push Services to DockerHub
    environment: test
    runs-on: ubuntu-latest
    
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      RUN_TAG: ${{ github.run_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Auxiliary Service (aux-service)
        run: |
          AUX_IMAGE=${{ env.DOCKER_USER }}/aux-service
          
  
          docker build . --file auxiliary-service/Dockerfile -t ${AUX_IMAGE}:latest -t ${AUX_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${AUX_IMAGE}:latest
          docker push ${AUX_IMAGE}:${{ env.RUN_TAG }}

      - name: Build and Push Main API Service (main-service)
        run: |
          MAIN_IMAGE=${{ env.DOCKER_USER }}/main-service

          docker build . --file main-api/Dockerfile -t ${MAIN_IMAGE}:latest -t ${MAIN_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${MAIN_IMAGE}:latest
          docker push ${MAIN_IMAGE}:${{ env.RUN_TAG }}


# 1. Update Manifest using Kustomize CLI
      - name: Update Kustomize Manifests
        # 🚨 CHANGE THIS ACTION 🚨
        uses: fluxcd/kustomize-action@v2 
        with:
          path: k8s # The directory containing kustomization.yaml
          # Use the 'kustomize edit set image' command directly
          command: edit set image ${{ env.DOCKER_USER }}/aux-service=${{ env.DOCKER_USER }}/aux-service:${{ env.RUN_TAG }} ${{ env.DOCKER_USER }}/main-service=${{ env.DOCKER_USER }}/main-service:${{ env.RUN_TAG }}

      # 2. Commit and Push using a dedicated action
      - name: Commit and Push Manifest Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Only commit the manifest file
          commit_files: k8s/kustomization.yaml
          commit_message: "GitOps: Automated manifest update for tag ${{ env.RUN_TAG }} [skip ci]"
          # Use the GITHUB_TOKEN (created by the runner) for authentication
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ensures this commit doesn't trigger a new pipeline run (optional but recommended)
          skip_ci: true