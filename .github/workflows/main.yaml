name: Application Deployment To EKS

on:
  push:
    branches:
      - cloud-challenge
      - main

jobs:
  docker_build:
    name: Build & Push Services to DockerHub
    environment: test
    runs-on: ubuntu-latest
    
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      RUN_TAG: ${{ github.run_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Auxiliary Service (aux-service)
        run: |
          AUX_IMAGE=${{ env.DOCKER_USER }}/aux-service
          
  
          docker build . --file auxiliary-service/Dockerfile -t ${AUX_IMAGE}:latest -t ${AUX_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${AUX_IMAGE}:latest
          docker push ${AUX_IMAGE}:${{ env.RUN_TAG }}

      - name: Build and Push Main API Service (main-service)
        run: |
          MAIN_IMAGE=${{ env.DOCKER_USER }}/main-service

          docker build . --file main-api/Dockerfile -t ${MAIN_IMAGE}:latest -t ${MAIN_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${MAIN_IMAGE}:latest
          docker push ${MAIN_IMAGE}:${{ env.RUN_TAG }}


# --- GIT WRITEBACK SETUP ---
      - name: Install Kustomize and Git Setup
        run: |
          # 1. Install Kustomize CLI
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          
          # 2. Configure Git User for the commit
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Update Kustomize Manifests and Commit
        run: |
          TAG=${{ env.RUN_TAG }}
          DOCKER_USER=${{ env.DOCKER_USER }} # Reference for clarity
          
          # 🚨 FIX 3: USE --kustomization flag (or cd) and REMOVE --path 🚨
          # We use --kustomization k8s to target the file from the repository root
          cd k8s
          # Update Auxiliary Service Image Tag
          /usr/local/bin/kustomize edit set image $DOCKER_USER/aux-service=$DOCKER_USER/aux-service:$TAG --kustomization k8s

          # Update Main API Image Tag
          /usr/local/bin/kustomize edit set image $DOCKER_USER/main-service=$DOCKER_USER/main-service:$TAG --kustomization k8s
          
          # Commit the change
          git add k8s/kustomization.yaml
          
          cd ..
          
          # Check if there are any changes before pushing to avoid error
          if git diff --staged --quiet; then
            echo "No manifest changes. Skipping commit."
          else
            git commit -m "GitOps: Automated manifest update for tag ${TAG} [skip ci]"
            # Use 'git push' without arguments to push to the checked-out branch
            git push
          fi