name: Application Deployment To EKS

on:
  push:
    branches:
      - cloud-challenge
      - main

jobs:
  docker_build:
    name: Build & Push Services to DockerHub
    environment: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      RUN_TAG: ${{ github.run_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Auxiliary Service (aux-service)
        run: |
          AUX_IMAGE=${{ env.DOCKER_USER }}/aux-service
          
  
          docker build . --file auxiliary-service/Dockerfile -t ${AUX_IMAGE}:latest -t ${AUX_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${AUX_IMAGE}:latest
          docker push ${AUX_IMAGE}:${{ env.RUN_TAG }}

      - name: Build and Push Main API Service (main-service)
        run: |
          MAIN_IMAGE=${{ env.DOCKER_USER }}/main-service

          docker build . --file main-api/Dockerfile -t ${MAIN_IMAGE}:latest -t ${MAIN_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${MAIN_IMAGE}:latest
          docker push ${MAIN_IMAGE}:${{ env.RUN_TAG }}


  deploy:
    needs: docker_build  # Run deploy after build completes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Checkout repo again for deploy step
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0  # Full history for ArgoCD

      - name: Install kubectl
        run: |
          curl -O https://s3.us-west-2.amazonaws.com/amazon-eks/1.30.7/2024-12-12/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl  # Download and install kubectl CLI

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd  # Download and install ArgoCD CLI

      - name: Login to ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure  # Authenticate to ArgoCD server

        