name: Application Deployment To EKS

on:
  push:
    branches:
      - cloud-challenge
      - main

jobs:
  docker_build:
    name: Build & Push Services to DockerHub
    environment: test
    runs-on: ubuntu-latest
    
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      RUN_TAG: ${{ github.run_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Auxiliary Service (aux-service)
        run: |
          AUX_IMAGE=${{ env.DOCKER_USER }}/aux-service
          
          # Build image from the aux-service directory using its specific Dockerfile
          docker build . --file auxiliary-service/Dockerfile -t ${AUX_IMAGE}:latest -t ${AUX_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${AUX_IMAGE}:latest
          docker push ${AUX_IMAGE}:${{ env.RUN_TAG }}

      - name: Build and Push Main API Service (main-service)
        run: |
          MAIN_IMAGE=${{ env.DOCKER_USER }}/main-service

          # Build image from the main-api directory using its specific Dockerfile
          docker build . --file main-api/Dockerfile -t ${MAIN_IMAGE}:latest -t ${MAIN_IMAGE}:${{ env.RUN_TAG }}
          
          # Push both tags
          docker push ${MAIN_IMAGE}:latest
          docker push ${MAIN_IMAGE}:${{ env.RUN_TAG }}

  trivy_scan:
    name: Scan Docker Images for Vulnerabilities
    needs: [docker_build]
    runs-on: ubuntu-latest
    
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      RUN_TAG: ${{ github.run_number }}
      
    steps:

      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Trivy # FIX 1: Reliable installation method
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.43.0
          trivy --version
          
      - name: Scan Auxiliary Service Image (aux-service)
        run: |
          AUX_IMAGE=${{ env.DOCKER_USER }}/aux-service 
          echo "Scanning auxiliary-service:${{ env.RUN_TAG }}"
          trivy image --severity HIGH,CRITICAL --format table ${AUX_IMAGE}:${{ env.RUN_TAG }}
        
      - name: Scan Main API Service Image (main-service)
        run: |
          MAIN_IMAGE=${{ env.DOCKER_USER }}/main-service
          echo "Scanning main-service:${{ env.RUN_TAG }}"
          trivy image --severity HIGH,CRITICAL --format table ${MAIN_IMAGE}:${{ env.RUN_TAG }}