apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-challenge-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/ARIES5533/CLOUD-CHALLENGE.git
    targetRevision: HEAD
    
    path: k8s
    
  destination:
    server: https://kubernetes.default.svc
    
    namespace: aux-service-ns 


  ignoreDifferences:
  - group: ""
    kind: ServiceAccount
    name: aux-service-sa
    namespace: aux-service-ns

    
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    
    automated:
      selfHeal: true
      prune: true